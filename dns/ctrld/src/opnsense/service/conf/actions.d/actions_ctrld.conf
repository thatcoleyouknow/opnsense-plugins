[start]
command:/usr/local/etc/rc.d/ctrld start
type:script
message:starting ctrld

[stop]
command:/usr/local/etc/rc.d/ctrld stop
type:script
message:stopping ctrld

[restart]
command:/usr/local/etc/rc.d/ctrld restart
type:script
message:restarting ctrld

[status]
command:/usr/local/etc/rc.d/ctrld status
type:script_output
message:get ctrld status

[clients]
command:/usr/local/bin/ctrld clients list
type:script_output
message:listing ctrld discovered clients

[log]
command:/bin/sh -c "if [ -f /var/log/ctrld.log ]; then tail -n 5000 /var/log/ctrld.log; else echo 'No log file yet -- ctrld may not have started, or has not logged anything yet.'; fi"
type:script_output
message:show ctrld log
