{#
    Rendered by `configd template reload OPNsense/Ctrld` into
    /etc/controld/ctrld.toml, then loaded via `ctrld start` (local config
    mode) / `ctrld reload` -- never via `ctrld start --cd`, which would
    auto-generate its own config and kill Unbound/Dnsmasq.

    Every array-backed model here (Listener/Upstream/Policy) is mounted at
    a path whose last segment matches its own <items> wrapper tag name
    (e.g. Listener.xml: <mount>//OPNsense/ctrld/listeners</mount> then
    <items><listeners><listener type="ArrayField">...). BaseField's
    addToXMLNode() adds one XML layer per non-ArrayField container and
    *skips* the ArrayField's own tag (confirmed against
    OPNsense\Base\FieldTypes\BaseField::addToXMLNode() and
    ArrayField::actionPostLoadingEvent(), which names each row node after
    the ArrayField's own tag) -- so the real config.xml path is mount
    segment + items-wrapper segment + the ArrayField's own repeated tag,
    THREE segments, not two. Confirmed against a real, deployed plugin
    with the identical pattern: dnscrypt-proxy's Forward.xml
    (mount=".../forward", items=<forwards><forward type="ArrayField">)
    and its own forwarding-rules.txt template, which reads
    'OPNsense.dnscryptproxy.forward.forwards.forward' -- not
    '...forward.forward'. Our own General.xml has no ArrayField wrapper
    at all, which is why 'OPNsense.ctrld.general.*' paths were never
    affected by this.

    helpers.toList()/getNodeByTag() and the '@uuid' attribute-access
    pattern below are confirmed against opnsense/core's actual
    service/modules/config.py (XML->dict conversion, attributes land as
    '@attr' keys) and template_helpers.py (Helpers.toList/getNodeByTag).

    [listener.N.policy]'s three array shapes -- "networks", "rules", and
    "macs" -- are confirmed directly against ctrld's real Go source
    (config.go's ListenerPolicyConfig struct and cmd/cli/dns_proxy.go's
    matching loops), not guessed: each one is matched against a
    different thing (CIDR-contains, domain-equals-or-wildcard, and
    MAC-equals-or-wildcard respectively), and a policy emitted into the
    wrong array silently never matches anything -- confirmed the hard
    way once already for 'mac' match-type policies, which an earlier
    version of this template put into "rules" alongside domain policies.
#}
{#
    log_path is fixed (not user-configurable) so the plugin's own log
    viewer (Services > ctrld > Log) always knows where to look.
    Without it, ctrld's own stdout/stderr just go to /dev/null, since
    rc.d/ctrld runs it under `daemon -f`.

    dhcp_lease_file_path/format is also fixed, not derived from anything
    the Dnsmasq plugin exposes to us. Confirmed on a live box: dnsmasq's
    own rc process (`/usr/local/sbin/dnsmasq -x ... -C
    /usr/local/etc/dnsmasq.conf`) passes no --dhcp-leasefile override, so
    it falls back to its own FreeBSD-compiled-in default of
    /var/db/dnsmasq.leases -- confirmed by that file being the one
    actively updated (recent mtime, real size) while OPNsense's other two
    lease-adjacent paths (/var/dhcpd/var/db/dhcpd.leases, an ISC-format
    leftover; /var/etc/dnsmasq-leases, an addn-hosts-format file dnsmasq.
    inc clears on start for a watcher script this setup doesn't use) sat
    stale/empty. Without this, ctrld's own "common file locations"
    auto-discovery has no reason to know this OPNsense-specific path, so
    client/hostname discovery silently finds nothing.
#}
{#
    helpers.getNodeByTag(...) | default(...) below, matching General.xml's
    own <Default> values -- not direct OPNsense.ctrld.general.X dot-chain
    access. If `template reload` ever runs before the General page has
    been saved once (e.g. right after plugin install), OPNsense.ctrld has
    no 'general' key at all yet: Jinja2's dot-chain access raises
    UndefinedError immediately on that missing *intermediate* step, before
    a trailing |default() filter ever gets a chance to run (confirmed by
    testing this exact scenario against the render harness -- an earlier
    version of this fix used dot-chain access, which looked fine against
    the normal case but threw on this one). getNodeByTag() doesn't have
    that problem: it returns None cleanly at any missing depth, by design
    (see this file's own header comment on it, and its use throughout the
    [listener] section below).

    |default(X, true) -- not plain |default(X): the second, positional
    true makes Jinja2's default filter also treat a "falsy" value as
    needing the fallback, not just its own Undefined sentinel. Plain
    |default(X) leaves a real Python None (exactly what getNodeByTag()
    returns) completely unchanged, which then renders as the literal
    4-character string "None" -- confirmed by testing this exact scenario
    too, and it's the identical failure class the listener-IP resolution
    fix elsewhere in this plugin already had to work around once before.
#}
[service]
    log_level = '{{ helpers.getNodeByTag('OPNsense.ctrld.general.logLevel') | default('info', true) }}'
    log_path = '/var/log/ctrld.log'
    dhcp_lease_file_path = '/var/db/dnsmasq.leases'
    dhcp_lease_file_format = 'dnsmasq'
    cache_enable = {{ 'true' if (helpers.getNodeByTag('OPNsense.ctrld.general.cacheEnable') | default('1', true)) == '1' else 'false' }}
    cache_size = {{ helpers.getNodeByTag('OPNsense.ctrld.general.cacheSize') | default(4096, true) }}
    cache_ttl_override = {{ helpers.getNodeByTag('OPNsense.ctrld.general.cacheTtlOverride') | default(0, true) }}
    cache_serve_stale = {{ 'true' if (helpers.getNodeByTag('OPNsense.ctrld.general.cacheServeStale') | default('1', true)) == '1' else 'false' }}

{% if helpers.toList('OPNsense.ctrld.listeners.listeners.listener') %}
[network]
{% set ns = namespace(net_idx = 0, net_uuid_map = {}) %}
{% for policy in helpers.toList('OPNsense.ctrld.policies.policies.policy') %}
{% if policy.enabled == '1' and policy.matchType == 'cidr' %}
  [network.{{ ns.net_idx }}]
    name = '{{ policy.description if policy.description else policy.matchValue }}'
    cidrs = ['{{ policy.matchValue }}']
{% set ns.net_uuid_map = ns.net_uuid_map.update({policy['@uuid']: ns.net_idx}) or ns.net_uuid_map %}
{% set ns.net_idx = ns.net_idx + 1 %}
{% endif %}
{% endfor %}

[upstream]
{% set ns2 = namespace(up_idx = 0, up_uuid_map = {}) %}
{% for upstream in helpers.toList('OPNsense.ctrld.upstreams.upstreams.upstream') %}
{% if upstream.enabled == '1' %}
{# nextdnsProfileId is authoritative over the stored endpoint whenever
   it's set, computed fresh here rather than trusted from a value the
   quick-add JS wrote once at edit time -- upstreams.volt's own quick-add
   only auto-fills endpoint as a one-time convenience, so if someone
   later hand-edits endpoint directly, a stored/cached endpoint could
   silently drift from what the profile ID actually implies. Recomputing
   it here means the two fields can never actually desync in the
   rendered config, regardless of what's cached in either one. #}
{% set endpoint = 'https://dns.nextdns.io/' ~ upstream.nextdnsProfileId if upstream.nextdnsProfileId else upstream.endpoint %}
  [upstream.{{ ns2.up_idx }}]
    name = '{{ upstream.name }}'
    type = '{{ upstream.type }}'
    endpoint = '{{ endpoint }}'
    timeout = {{ upstream.timeout }}
{% set ns2.up_uuid_map = ns2.up_uuid_map.update({upstream['@uuid']: ns2.up_idx}) or ns2.up_uuid_map %}
{% set ns2.up_idx = ns2.up_idx + 1 %}
{% endif %}
{% endfor %}

[listener]
{% set ns3 = namespace(l_idx = 0) %}
{% for listener in helpers.toList('OPNsense.ctrld.listeners.listeners.listener') %}
{% if listener.enabled == '1' %}
{# 'lo0' is a pseudo-interface added by ListenerInterfaceField -- it has no
   node under interfaces.* to resolve via getNodeByTag, so it's mapped to
   the literal loopback address here instead. ipVersion picks which family
   (of the pseudo-interface's two loopback addresses, or of a real
   interface's ipaddr/ipaddrv6 fields) this listener actually binds. #}
{% set ip_field = 'ipaddrv6' if listener.ipVersion == 'ipv6' else 'ipaddr' %}
{% if listener.interface == 'lo0' %}
{% set listener_ip = '::1' if listener.ipVersion == 'ipv6' else '127.0.0.1' %}
{% else %}
{% set listener_ip = helpers.getNodeByTag('interfaces.' ~ listener.interface ~ '.' ~ ip_field) %}
{% endif %}
  [listener.{{ ns3.l_idx }}]
    ip = '{{ listener_ip }}'
    port = {{ listener.port }}
    [listener.{{ ns3.l_idx }}.policy]
      name = '{{ listener.description if listener.description else 'listener-' ~ ns3.l_idx }}'
      {# Fixed, not user-configurable: only takes effect for a rule/network
         that actually has a fallback upstream set (a list of one upstream
         has nowhere to fail over to either way), so this is safe to always
         include rather than adding a second form field for it. #}
      failover_rcodes = ['SERVFAIL']
      networks = [
{% for policy in helpers.toList('OPNsense.ctrld.policies.policies.policy') %}
{% if policy.enabled == '1' and policy.matchType == 'cidr' and policy.listener == listener['@uuid'] and policy.upstream in ns2.up_uuid_map %}
{% set policy_upstreams = ["'upstream." ~ ns2.up_uuid_map[policy.upstream] ~ "'"] %}
{% if policy.fallbackUpstream and policy.fallbackUpstream in ns2.up_uuid_map %}
{% set policy_upstreams = policy_upstreams + ["'upstream." ~ ns2.up_uuid_map[policy.fallbackUpstream] ~ "'"] %}
{% endif %}
        { 'network.{{ ns.net_uuid_map[policy['@uuid']] }}' = [{{ policy_upstreams|join(', ') }}] },
{% endif %}
{% endfor %}
      ]
      rules = [
{% for policy in helpers.toList('OPNsense.ctrld.policies.policies.policy') %}
{% if policy.enabled == '1' and policy.matchType == 'domain' and policy.listener == listener['@uuid'] and policy.upstream in ns2.up_uuid_map %}
{% set policy_upstreams = ["'upstream." ~ ns2.up_uuid_map[policy.upstream] ~ "'"] %}
{% if policy.fallbackUpstream and policy.fallbackUpstream in ns2.up_uuid_map %}
{% set policy_upstreams = policy_upstreams + ["'upstream." ~ ns2.up_uuid_map[policy.fallbackUpstream] ~ "'"] %}
{% endif %}
        { '{{ policy.matchValue }}' = [{{ policy_upstreams|join(', ') }}] },
{% endif %}
{% endfor %}
      ]
      {# ctrld's ListenerPolicyConfig has THREE separate rule arrays, not
         two -- networks (CIDR), rules (domain), and macs -- each matched
         against a different thing (cmd/cli/dns_proxy.go's networkRules/
         macRules/domain-rules loops, confirmed against real ctrld
         source). An earlier version of this template put 'mac' match-type
         policies into this same `rules` array alongside domain policies,
         which ctrld's `rules` loop compares only against the queried
         *domain name* -- so every MAC-match policy silently never
         matched anything, ever. #}
      macs = [
{% for policy in helpers.toList('OPNsense.ctrld.policies.policies.policy') %}
{% if policy.enabled == '1' and policy.matchType == 'mac' and policy.listener == listener['@uuid'] and policy.upstream in ns2.up_uuid_map %}
{% set policy_upstreams = ["'upstream." ~ ns2.up_uuid_map[policy.upstream] ~ "'"] %}
{% if policy.fallbackUpstream and policy.fallbackUpstream in ns2.up_uuid_map %}
{% set policy_upstreams = policy_upstreams + ["'upstream." ~ ns2.up_uuid_map[policy.fallbackUpstream] ~ "'"] %}
{% endif %}
        { '{{ policy.matchValue }}' = [{{ policy_upstreams|join(', ') }}] },
{% endif %}
{% endfor %}
      ]
{% set ns3.l_idx = ns3.l_idx + 1 %}
{% endif %}
{% endfor %}
{% endif %}
