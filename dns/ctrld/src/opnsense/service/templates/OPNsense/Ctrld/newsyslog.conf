{#
    Registered via +TARGETS as newsyslog.conf:/etc/newsyslog.conf.d/ctrld,
    matching the real pattern OPNsense core's own www/nginx plugin uses for
    its own newsyslog.conf.d entry (confirmed against its real +TARGETS and
    template file) -- ctrld.log otherwise grows forever, since ctrld itself
    has no built-in rotation/max-size option.

    Every field below confirmed against the real newsyslog.conf(5) man
    page, not guessed:

    mode 600, not nginx's 640 -- DNS query logs are effectively browsing
    history (domains queried, client hostnames); no other user/group on
    this appliance needs read access.

    count 7 -- bounded history without excessive disk use. Nginx keeps 14;
    this log is more likely to spike in volume (debug level logs every
    query) and less likely to need two weeks of history than a web
    server's access log.

    size 10240 (10MB) as the primary trigger, not nginx's unbounded `*` --
    per-query debug-level logging has no natural rate limit the way a web
    access log roughly does, so a bad day of query volume shouldn't be
    able to fill the partition before the next scheduled rotation.

    when $D0 (rotate at midnight -- confirmed equivalent to @T00 in the
    man page) as a time-based backstop alongside size, so a quiet period
    doesn't let a merely-large-but-under-10MB file linger indefinitely.

    flags Z (gzip-compress rotated copies) N (explicitly "no process needs
    signaling on rotation" -- not an omission of a pid_file field).
    Deliberately not reopening ctrld's log on rotation via a pid+signal:
    would need confirming ctrld supports a log-reopen signal at all, and
    the practical cost of not doing it is bounded, since `daemon -r`
    restarts ctrld on any crash and Apply/reconfigure cycles happen
    reasonably often anyway -- the window where ctrld could still be
    writing into a rotated-away file is short-lived in practice. A
    deliberate tradeoff, not an oversight.

    No B (binary) flag: ctrld's log is JSON-lines text, and
    LogController::parseLine() already tolerates a non-JSON line
    gracefully (shows it verbatim rather than dropping it), so
    newsyslog's own informational rotation-marker line is harmless and
    mildly useful, not something that needs suppressing.
#}
# logfilename          [owner:group]  mode  count  size    when   flags
/var/log/ctrld.log      root:wheel     600    7     10240   $D0     ZN
